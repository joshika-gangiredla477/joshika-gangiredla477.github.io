<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>

    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>

<body>
    <main>

        <!-- PROFILE HEADER -->
        <section class="profile-card">
            <div class="profile-avatar"></div>

            <h1>User</h1>
            <p class="profile-sub">Meal Planner Enthusiast</p>

            <button class="edit-btn">Edit Profile</button>
        </section>

        <!-- STATS -->
        <section class="profile-stats">
            <div class="stat">
                <h2>24</h2>
                <p>Meals Planned</p>
            </div>

            <div class="stat">
                <h2>12</h2>
                <p>Favorites</p>
            </div>

            <div class="stat">
                <h2>5</h2>
                <p>Weeks Active</p>
            </div>
        </section>

        <!-- SETTINGS -->
        <section class="profile-settings">
            <h2>Settings</h2>

            <div class="setting-item">Diet Preference</div>
            <div class="setting-item">Allergies</div>
            <div class="setting-item">Notifications</div>
            <div class="setting-item">Account</div>
        </section>

        <!-- NAV -->
        <nav class="bottom-nav">
            <a href="index.html">
                <span class="material-symbols-outlined nav-icon">home</span>
            </a>

            <a href="search.html">
                <span class="material-symbols-outlined nav-icon">search</span>
            </a>

            <a href="calendar.html">
                <span class="material-symbols-outlined nav-icon">calendar_month</span>
            </a>

            <a href="profile.html">
                <span class="material-symbols-outlined nav-icon active">person</span>
            </a>

        </nav>

    </main>
</body>
</html>
