<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>

    <link rel="stylesheet" href="styles.css">
    <script src="calendar.js" defer></script>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>

<body>

    <main>

        <!-- CALENDAR PAGE -->
        <section class="calendar">

            <!-- HEADER -->
            <div class="calendar-header">

                <button id="prevMonth">‹</button>

                <h2 id="monthLabel"></h2>

                <button id="nextMonth">›</button>

            </div>

            <!-- DAYS -->
            <div class="calendar-days">
                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>
            </div>

            <!-- CALENDAR GRID -->
            <div class="calendar-grid" id="calendarGrid"></div>

            <!-- SELECTED DAY PLAN -->
            <section class="day-plan">

                <div class="plan-header">

                    <div>
                        <p class="plan-date-label">Selected Day</p>
                        <h3></h3>
                    </div>

                    <button class="add-btn">
                        <span class="material-symbols-outlined">+</span>
                    </button>

                </div>

                <!-- MEAL LIST -->
                <div class="plan-list"></div>
            </section>

        </section>

        <!-- POPUP SEARCH -->
<div id="mealPopup" class="popup hidden">

    <div class="popup-box">

        <div class="popup-header">
            <h3>Search Meal</h3>
            <button id="closePopup">×</button>
        </div>

        <div class="popup-search">
            <input type="text" id="popupInput" placeholder="Search meals...">
            <button id="popupSearchBtn">Search</button>
        </div>

        <div id="popupResults"></div>

    </div>

</div>



        <!-- BOTTOM NAV -->
        <nav class="bottom-nav">

            <a href="index.html">
                <span class="material-symbols-outlined nav-icon">home</span>
            </a>

            <a href="search.html">
                <span class="material-symbols-outlined nav-icon">search</span>
            </a>

            <a href="calendar.html">
                <span class="material-symbols-outlined nav-icon active">calendar_month</span>
            </a>

            <a href="profile.html">
                <span class="material-symbols-outlined nav-icon">person</span>
            </a>

        </nav>

    </main>

</body>

</html>
