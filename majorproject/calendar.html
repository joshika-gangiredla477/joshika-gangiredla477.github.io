<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>

    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>

<body>
    <main>

<section class="calendar">

    <!-- HEADER -->
    <div class="calendar-header">
        <button id="prevMonth">‹</button>
        <h2 id="monthLabel">March 2026</h2>
        <button id="nextMonth">›</button>
    </div>

    <!-- DAYS LABEL -->
    <div class="calendar-days">
        <div>Sun</div>
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div>Sat</div>
    </div>

    <!-- CALENDAR GRID -->
    <div class="calendar-grid" id="calendarGrid">

       
        <div class="day-card empty"></div>
        <div class="day-card empty"></div>

        <div class="day-card">
            <p class="date">1</p>
            <span class="meal-pill">Chicken Bowl</span>
        </div>

        <div class="day-card">
            <p class="date">2</p>
            <span class="meal-pill">Pasta</span>
            <span class="meal-pill">Salad</span>
        </div>

       

    </div>

</section>

        <!-- NAV -->
        <nav class="bottom-nav">
            <a href="index.html">
                <span class="material-symbols-outlined nav-icon">home</span>
            </a>

            <a href="search.html">
                <span class="material-symbols-outlined nav-icon">search</span>
            </a>

            <a href="calendar.html">

            <span class="material-symbols-outlined nav-icon active">calendar_month</span>

            </a>

            <a href="profile.html">
                <span class="material-symbols-outlined nav-icon">person</span>
            </a>
        </nav>

    </main>
</body>
</html>
