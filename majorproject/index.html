<!DOCTYPE html>
<html>

<head>
    <!-- meta tags and title -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Major Project</title>

    <!-- external CSS -->
    <link rel="stylesheet" href="styles.css" media="all">
    <style>
        /* in-file CSS here */
    </style>

    <!-- external JavaScript -->
    <script src="scripts.js" defer></script>
    <script>
        // in-page JavaScript here
    </scriptU    <!-- icons for the nav bar -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

<body>
    <main>
        <!-- HERO SECTION -->
        <section class="hero">
            <h1>Hello User,</h1>

            <h2>What do you want to eat today?</h2>
            <p>Find meals, plan your week, and simplify your routine.</p>

            <div class="hero-action">
                <p class="today-label">Today’s Plan</p>

                <div class="today-scroll">
                    <div class="today-card">
                        <img src="/majorproject/images/grilledchicken.jpg" alt="meal">
                        <span class="meal-type">Lunch</span>
                        <h3>Grilled Chicken Bowl</h3>
                    </div>

                    <div class="today-card">
                        <img src="/majorproject/images/pestopasta.jpg" alt="meal">
                        <span class="meal-type">Dinner</span>
                        <h3>Pesto Pasta</h3>
                    </div>

                    <div class="today-card">
                        <img src="/majorproject/images/fruitparfait.jpg" alt="meal">
                        <span class="meal-type">Snack</span>
                        <h3>Fruit Parfait</h3>
                    </div>
                </div>
            </div>

        </section>

        <!-- RECOMMENDED MEALS -->
        <section class="recommended">
            <h2>Recommended for you</h2>
            <div id="mealsGrid">
                <div class="mealCard">
                    <div class="mealName"> Pesto Pasta </div>
                    <div class="mealCategory"> Vegiterian </div>
                    <div class="kCal">kCal: 200</div>
                    <div class="cookTime"> Time: 45min </div>
                </div>

                <div class="mealCard">
                    <div class="mealName"> Pesto Pasta </div>
                    <div class="mealCategory"> Vegiterian </div>
                    <div class="kCal">kCal: 200</div>
                    <div class="cookTime"> Time: 45min </div>
                </div>

                <div class="mealCard">
                    <div class="mealName"> Pesto Pasta </div>
                    <div class="mealCategory"> Vegiterian </div>
                    <div class="kCal">kCal: 200</div>
                    <div class="cookTime"> Time: 45min </div>
                </div>

                <div class="mealCard">
                    <div class="mealName"> Pesto Pasta </div>
                    <div class="mealCategory"> Vegiterian </div>
                    <div class="kCal">kCal: 200</div>
                    <div class="cookTime"> Time: 45min </div>
                </div>

            </div>
        </section>

        <nav class="bottom-nav">
            <span class="material-symbols-outlined nav-icon active">home</span>
            <span class="material-symbols-outlined nav-icon">search</span>
            <span class="material-symbols-outlined nav-icon">calendar_month</span>
            <span class="material-symbols-outlined nav-icon">person</span>
        </nav>

    </main>
