<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Project 6: Weather App</title>

    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>

</head>

<body>

    <div id="modalCover"></div>
    <div id="modalForm">
        <form id="locationForm">
            <input type="text" id="locationBox">
                <button type="submit"> Get Weather </button>
        </form>

    </div>

    <button id="findLocation">new location</button>

    <main>

    <!-- HERO / CURRENT WEATHER -->
    <section id="currentInfo">

        <div id="location">Pullman, WA</div>

        <div id="currentTemp"><span></span>°F</div>

        <div id="currentStatus">Sunny</div>

    </section>


    <!-- DETAILS -->
    <section id="details">

        <div class="detailBox">
            <div class="label">Humidity</div>
            <div class="humidityValue"><span></span>%</div>
        </div>

        <div class="detailBox">
            <div class="label">Wind</div>
            <div class="windValue"></div>
        </div>

    </section>


    <!-- FORECAST (SIDE SCROLL) -->
    <section id="futureInfo">

        <div class="futureDay">
            <div class="day">Mon</div>
            <div class="tempRange"><span></span>°F</div>
            <div class="status">☁️ Cloudy</div>
            <div class="wind">6mph NW</div>
        </div>

        <div class="futureDay">
            <div class="day">Tue</div>
            <div class="tempRange"><span></span>°F</div>
            <div class="status">🌧 Rainy</div>
            <div class="wind">8mph NW</div>
        </div>

        <div class="futureDay">
            <div class="day">Wed</div>
            <div class="tempRange"><span></span>°F</div>
            <div class="status">☀️ Sunny</div>
            <div class="wind">4mph NW</div>
        </div>

    </section>

</main>

</body>
</html>
